name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:                    # reusable by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version (CLAUDE.md "no hardcoded toolchain versions
        # in CI YAML") — read the pin and hand it to the upstream installer.
        #
        # Do NOT hand-roll this by untarring the release asset into
        # $HOME/.cyrius/{bin,lib}: that is the pre-6.5 layout. From 6.5.x
        # `cyrius deps` resolves the stdlib snapshot from
        # $HOME/.cyrius/versions/$CYRIUS_VERSION/lib and hard-fails with
        # "pins version X but it is not installed" if only the flattened
        # dirs exist. The installer lays out versions/<v>/{bin,lib} and
        # symlinks bin/ + lib/ at it, and additionally does SHA256 +
        # signature verification the hand-rolled block skipped (which also
        # had `|| true` on every cp, so a half-copied toolchain looked
        # like a clean install). Same pattern as darshana / patra / libro.
        #
        # The installer itself comes from the PIN's tag, never from `main`
        # (F-042). Through 1.1.0 this piped `…/cyrius/main/scripts/install.sh`
        # into sh, so a push to upstream's mutable default branch ran on
        # every hapi build even though the toolchain version was pinned —
        # and the script being run is the one that does the SHA256 and
        # signature checks. Upstream's own `cyriusly install` stopped
        # fetching from main for this reason (cyrius 6.2.30 / 6.6.20). It is
        # fetched to a file, not piped: `curl | sh` exits 0 when the fetch
        # fails, because sh happily runs an empty script.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION (installer from tag $CYRIUS_VERSION)"
          INSTALLER="$RUNNER_TEMP/cyrius-install.sh"
          curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/$CYRIUS_VERSION/scripts/install.sh" \
            -o "$INSTALLER" \
            || { echo "::error::could not fetch scripts/install.sh at tag $CYRIUS_VERSION"; exit 1; }
          CYRIUS_VERSION="$CYRIUS_VERSION" sh "$INSTALLER"
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Build (aarch64, compile-only)
        # Cross-compile only — this proves the target still COMPILES;
        # "Test (aarch64, under qemu)" below proves it BEHAVES. Keep both:
        # `--aarch64` silently stopped building at 1.0.2 (a bare
        # `SYS_OPEN`, the one constant the aarch64 table deliberately
        # does not define) and nothing noticed until 1.0.4, because CI
        # built x86_64 only. Since cyrius 6.5.1 a wrong argument count
        # is a hard error rather than a warning, so an unbuilt target
        # can now break on drift that x86_64 accepts.
        run: cyrius build --aarch64 src/main.cyr build/${{ github.event.repository.name }}-aarch64

      - name: Build (agnos)
        # Same rationale. hapi's agnos arm is a real second syscall ABI
        # (explicit path lengths, sync-for-fsync, mkdir's length-not-mode
        # second argument) living behind #ifdef CYRIUS_TARGET_AGNOS, so
        # it is invisible to every other build. "agnos smoke" below runs
        # this binary under mirshi.
        run: cyrius build --agnos src/main.cyr build/${{ github.event.repository.name }}-agnos

      - name: Concurrency harness
        # scripts/concurrency-test.sh covers F-012 — the unlocked
        # manifest read-modify-write. It needs two hapi PROCESSES
        # racing, which the .tcyr harness cannot express (it cannot
        # fork, and hapi is syscall-only by rule), so it runs here
        # rather than under `cyrius test`.
        run: sh scripts/concurrency-test.sh build/${{ github.event.repository.name }}

      - name: Build mirshi (the agnos runner)
        # mirshi, the AGNOS->Linux syscall supervisor, runs an agnos ELF as
        # a native process under ptrace (fine on a hosted runner: it traces
        # its own child, and mirshi's own CI does the same). The tag and
        # the recipe live in the script, not here; it builds mirshi with
        # hapi's cyrius pin, so one toolchain serves both.
        run: sh scripts/build-mirshi.sh "$RUNNER_TEMP"

      - name: Build agnos tests
        # tests/agnos.tcyr is target-neutral: `cyrius test` runs it on
        # x86_64 and aarch64 below, and this agnos build of it runs under
        # mirshi in the next step.
        run: cyrius build --agnos tests/agnos.tcyr build/${{ github.event.repository.name }}-agnos-tests

      - name: agnos smoke (under mirshi)
        # The agnos arm is a second syscall ABI, and several findings are
        # properties of it alone (F-027, F-031/F-039, F-038, F-040, F-044).
        # Through 1.1.0 this step looked for a mirshi the runner never had,
        # got exit 2 (SKIP) on every run, and only warned — so hapi's agnos
        # code was compiled in CI and never executed (F-043). The step now
        # brings its own mirshi, and ANY non-zero exit fails, SKIP included.
        run: |
          sh scripts/agnos-smoke.sh "$RUNNER_TEMP/mirshi/build/mirshi" \
            build/${{ github.event.repository.name }}-agnos \
            build/${{ github.event.repository.name }}-agnos-tests

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Test (aarch64, under qemu)
        # The suite again, as an aarch64 binary. Compile-only is how
        # hapi_open_nofollow's x86_64 O_NOFOLLOW literal (131072, which
        # is O_LARGEFILE on arm64) followed symlinks on aarch64 from
        # 0.9.0 to 1.0.11 with CI green: the test that catches it had
        # only ever run on x86_64. Under qemu it failed 10 of 365.
        #
        # cyrius execs aarch64 test binaries via /usr/bin/qemu-aarch64
        # (a hardcoded path), which qemu-user provides. hapi's ELFs are
        # static, so no aarch64 sysroot or binfmt is needed. A missing
        # qemu FAILS this step (cyrius exits 127); it never skips.
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          test -x /usr/bin/qemu-aarch64 \
            || { echo "::error::qemu-user did not provide /usr/bin/qemu-aarch64"; exit 1; }
          cyrius test --aarch64
